<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>AI Text Summarizer</h1>
    <p>Paste your text below, and our AI will generate a concise summary.</p>

    <!-- Input Section -->
    <textarea id="text-input" rows="10" placeholder="Paste your text here... (minimum 50 words)"></textarea>
    
    <button id="summarize-btn">Summarize Text</button>

    <!-- Output Section -->
    <h2>Summary:</h2>
    <textarea id="summary-output" rows="6" placeholder="Your summary will appear here..." readonly></textarea>

    <script src="script.js"></script>
</body>
</html>
